name: diagnose
# One-off: check whether legacy OSCAR pages still serve seat data to runners.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash {0}
    steps:
      - name: Legacy OSCAR detail pages
        run: |
          for crn in 29737 28330; do
            echo; echo "### legacy detail CRN $crn"
            curl -sS -m 25 -A "Mozilla/5.0" -o /tmp/d.html -w "http=%{http_code} size=%{size_download} t=%{time_total}\n" "https://oscar.gatech.edu/bprod/bwckschd.p_disp_detail_sched?term_in=202702&crn_in=$crn" 2>&1
            sed -e 's/<[^>]*>/ /g' /tmp/d.html | tr -s ' \t\r\n' ' ' | grep -oiE "(Status:|Registration Dates|Seats Capacity|Waitlist Seats|Class Attributes|Spring 2027|Fall 2026|Term:|[A-Z]{2,4} [0-9]{4}[^<]{0,80}).{0,160}" | head -8
          done
          echo; echo "### legacy path variant (/pls/bprod)"
          curl -sS -m 25 -A "Mozilla/5.0" -o /dev/null -w "http=%{http_code}\n" "https://oscar.gatech.edu/pls/bprod/bwckschd.p_disp_detail_sched?term_in=202702&crn_in=29737" 2>&1
          exit 0
