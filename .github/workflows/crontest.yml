name: crontest
# DISPOSABLE probe: does this repo receive `schedule` events at all?
# Several near-term minutes to sample multiple ticks quickly. Delete after.
on:
  schedule:
    - cron: '26 * * * *'
    - cron: '29 * * * *'
    - cron: '32 * * * *'
    - cron: '35 * * * *'
    - cron: '40 * * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "cron probe fired at $(date -u +%H:%M:%SZ) event=${{ github.event_name }}"
