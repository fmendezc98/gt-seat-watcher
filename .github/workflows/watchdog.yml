name: watchdog
on:
  schedule:
    - cron: '17 * * * *'  # hourly, off-peak minute
  workflow_dispatch:
permissions:
  contents: read
  actions: read           # needed to inspect seat-watch run history
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 watch_seats_ci.py --watchdog
